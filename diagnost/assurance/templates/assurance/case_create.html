{% extends 'diagnost/base.html' %}
{% block content %}
<section class="az-diagnostic-page"><div class="container">
  <div class="az-diagnostic-card">
    <h1>Create Repair Case</h1>
    <p>The selected published procedure version will be pinned to this repair.</p>
    <form method="post">
      {% csrf_token %}{{ form.as_p }}
      <button class="az-btn az-btn-primary" type="submit">Create executable repair</button>
    </form>
  </div>
</div></section>
{% endblock %}
