{% extends 'diagnost/base.html' %}
{% block content %}
<section class="az-diagnostic-page"><div class="container">
  <h1>Repair Cases</h1>
  {% for case in cases %}
    <div class="az-diagnostic-card">
      <h2><a href="{% url 'assurance:case_detail' case.id %}">{{ case.vehicle }} — {{ case.title }}</a></h2>
      <p>{{ case.procedure_version }} · {{ case.get_status_display }}</p>
    </div>
  {% empty %}<p>No assigned repair cases.</p>{% endfor %}
</div></section>
{% endblock %}
