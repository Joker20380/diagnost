{% extends 'diagnost/base.html' %}
{% block content %}
<section class="az-diagnostic-page"><div class="container">
  <h1>Evidence-based competency review</h1>
  <p>Select only evidence personally submitted by the technician for completed operations requiring this skill.</p>
  <form method="post" class="az-diagnostic-card">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button class="az-btn az-btn-primary" type="submit">Record immutable decision</button>
    <a class="az-btn az-btn-outline" href="{% url 'assurance:case_list' %}">Cancel</a>
  </form>
</div></section>
{% endblock %}
